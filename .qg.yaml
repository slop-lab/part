hooks:
  preCommit:
    installation: auto

artifacts:
  generated:
    include: ['preview/**', 'artifacts/**']

rules:
  # Prettier pads Markdown table cells to align columns.
  markdown/no-extra-table-cell-whitespace: off

checks:
  build: node scripts/build.mjs
  tests:
    type: node-test
    files: ['tests/*.test.ts']

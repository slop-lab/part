name: Validate part
on: [push, pull_request]
jobs:
  validate:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        node: ['24.22.0', '24', '26']
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npm run format:check
      - run: npm run check
      - run: npm test
      - run: npm run test:consumers
      - run: npm run preview:build
      - run: npx playwright install --with-deps chromium
        if: matrix.node == '24' && matrix.os == 'ubuntu-latest'
      - run: node scripts/test-playground-browser.mjs
        if: matrix.node == '24' && matrix.os == 'ubuntu-latest'
      - run: npm run measure
      - run: npm run measure:ui
      - run: npm run pack:local
      - run: node scripts/check-release.mjs
